<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Omaha '93</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a26"/>
      <stop offset="0.38" stop-color="#4a2178"/>
      <stop offset="0.62" stop-color="#b1306a"/>
      <stop offset="0.82" stop-color="#f06a3a"/>
      <stop offset="1" stop-color="#ffb13b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.45" stop-color="#ffc53d"/>
      <stop offset="0.8" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ef4f4a"/>
    </linearGradient>
    <mask id="cuts">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="0" y="236" width="512" height="6" fill="#000"/>
      <rect x="0" y="258" width="512" height="8" fill="#000"/>
      <rect x="0" y="282" width="512" height="10" fill="#000"/>
      <rect x="0" y="308" width="512" height="13" fill="#000"/>
      <rect x="0" y="337" width="512" height="16" fill="#000"/>
    </mask>
    <clipPath id="tile"><rect width="512" height="512" rx="104"/></clipPath>
    <!-- 7-segment "93" like a tape counter; each digit 64 × 112 -->
    <g id="d9">
      <rect x="8" y="0" width="48" height="14" rx="3"/>
      <rect x="0" y="8" width="14" height="46" rx="3"/>
      <rect x="50" y="8" width="14" height="46" rx="3"/>
      <rect x="8" y="49" width="48" height="14" rx="3"/>
      <rect x="50" y="58" width="14" height="46" rx="3"/>
      <rect x="8" y="98" width="48" height="14" rx="3"/>
    </g>
    <g id="d3">
      <rect x="8" y="0" width="48" height="14" rx="3"/>
      <rect x="50" y="8" width="14" height="46" rx="3"/>
      <rect x="12" y="49" width="44" height="14" rx="3"/>
      <rect x="50" y="58" width="14" height="46" rx="3"/>
      <rect x="8" y="98" width="48" height="14" rx="3"/>
    </g>
    <g id="yr">
      <rect x="0" y="0" width="13" height="34" rx="3" transform="skewX(-12)"/>
      <use href="#d9" x="26"/>
      <use href="#d3" x="108"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- scanlines -->
    <g fill="#000" opacity="0.12">
      <rect y="20" width="512" height="3"/><rect y="44" width="512" height="3"/><rect y="68" width="512" height="3"/>
      <rect y="92" width="512" height="3"/><rect y="116" width="512" height="3"/><rect y="140" width="512" height="3"/>
      <rect y="164" width="512" height="3"/><rect y="188" width="512" height="3"/><rect y="212" width="512" height="3"/>
    </g>
    <!-- striped sunset sun -->
    <circle cx="238" cy="318" r="150" fill="url(#sun)" mask="url(#cuts)"/>
    <!-- skyline: downtown towers (tall slab = Woodmen Tower) + North O storefronts -->
    <path fill="#12041d" d="M0 512V392h34v-30h40v44h26v-76h46v-54h20v-12h34v12h16v-94h54v94h14v60h30v-48h44v70h24v-28h40v40h24v-22h30v36h36V512z"/>
    <g fill="#ffd35a" opacity="0.85">
      <rect x="224" y="198" width="8" height="6"/><rect x="240" y="198" width="8" height="6"/><rect x="256" y="198" width="8" height="6"/>
      <rect x="224" y="220" width="8" height="6"/><rect x="256" y="220" width="8" height="6"/>
      <rect x="240" y="242" width="8" height="6"/><rect x="256" y="242" width="8" height="6"/>
      <rect x="224" y="264" width="8" height="6"/><rect x="240" y="286" width="8" height="6"/>
      <rect x="112" y="346" width="10" height="7"/><rect x="128" y="366" width="10" height="7"/>
      <rect x="324" y="306" width="10" height="7"/><rect x="340" y="330" width="10" height="7"/>
      <rect x="392" y="346" width="10" height="7"/>
    </g>
    <rect y="452" width="512" height="60" fill="#0a0212"/>
    <path d="M0 452h512" stroke="#ff7a2f" stroke-width="4" opacity="0.7"/>
    <!-- '93 with chromatic fringing -->
    <g transform="translate(296 60)">
      <use href="#yr" x="-5" fill="#2f6bff"/>
      <use href="#yr" x="5" fill="#ff2a3a"/>
      <use href="#yr" fill="#fffaf0"/>
    </g>
  </g>
</svg>
